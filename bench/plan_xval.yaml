title: "min_correlation tightening: portability to dataset_B/dataset_A (the entrapment-confirmed dataset_D winner)"
# On dataset_D, gate:min_correlation 0.3->0.6 gained +840 peptides that entrapment confirmed carry no
# extra error (86 hits vs 99 expected, -1.3 sigma). Project policy: a small effect must replicate
# on a second sample before the default moves, because Sage's sample-to-sample offset drift is
# comparable to a 2-5% effect. This tests base vs 0.5 and 0.6 on BOTH other samples, one binary,
# one invocation per the harness -- so a per-sample delta cannot be a cross-config artefact.
#
# Pre-registered, same rule as the dataset_D work: a win must (a) gain peptides at nominal q<=0.01 AND
# (b) not raise the entrapment error rate (scored after). If the direction flips sign on dataset_B or dataset_A,
# the dataset_D gain was sample-specific and the default stays at 0.3.
samples: [dataset_B, dataset_A]
binary: /scratch/kohlbach/OpenMS/build/bin/spextractor
threads: 100
arms:
  - name: base
    params:
      trace:ms2_chrom_peak_snr: 1.0
      trace:ms2_noise_threshold_int: 10
      trace:ms2_min_length_sec: 0
      trace:ms2_split_valleys: 7.0
      trace:ms1_split_valleys: 7.0
      charge:scoring: count
      perf:trace_bands: 12
  - name: corr050
    baseline: base
    params:
      trace:ms2_chrom_peak_snr: 1.0
      trace:ms2_noise_threshold_int: 10
      trace:ms2_min_length_sec: 0
      trace:ms2_split_valleys: 7.0
      trace:ms1_split_valleys: 7.0
      charge:scoring: count
      perf:trace_bands: 12
      gate:min_correlation: 0.50
  - name: corr060
    baseline: base
    params:
      trace:ms2_chrom_peak_snr: 1.0
      trace:ms2_noise_threshold_int: 10
      trace:ms2_min_length_sec: 0
      trace:ms2_split_valleys: 7.0
      trace:ms1_split_valleys: 7.0
      charge:scoring: count
      perf:trace_bands: 12
      gate:min_correlation: 0.60
